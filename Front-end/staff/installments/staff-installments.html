<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EliraPay — Admin · Installments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-building-bank"></i></div><span class="sidebar-logo-text">EliraPay</span></div>
  <div class="role-badge" id="role-badge"><i class="ti ti-id-badge"></i> <span id="role-label">Staff</span></div>
  <div class="sidebar-section">Overview</div>
  <a class="nav-item" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
  <div class="sidebar-section">Operations</div>
  <a class="nav-item" href="../../staff/accounts/staff-accounts.html"><i class="ti ti-wallet"></i> Accounts</a>
  <a class="nav-item" href="../../staff/transactions/staff-transactions.html"><i class="ti ti-arrows-right-left"></i> Transactions</a>
  <a class="nav-item manager-only" id="nav-loans" href="../../staff/loans/staff-loans.html"><i class="ti ti-coin"></i> Loan Requests <span class="nav-badge" id="pending-badge">—</span></a>
  <a class="nav-item active" href="../../staff/installments/staff-installments.html"><i class="ti ti-receipt"></i> Installments</a>
  <div class="sidebar-section">Customer</div>
  <a class="nav-item" href="../../staff/users/staff-users.html"><i class="ti ti-users"></i> Customers</a>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar" style="background:linear-gradient(135deg,#10b981,#059669);">--</div>
      <div class="user-info"><div class="user-name" id="sidebar-name">Staff</div><div class="user-role-txt" id="sidebar-role">Employee</div></div>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Installment Management</h1><p>View overdue installments and apply penalties</p></div>
    <a class="back-btn" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="content">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-overdue"  onclick="switchTab('overdue')"><i class="ti ti-alert-triangle"></i> Overdue <span class="tab-count" id="cnt-overdue">—</span></button>
      <button class="tab-btn"        id="tab-all"      onclick="switchTab('all')"><i class="ti ti-list"></i> All Installments <span class="tab-count" id="cnt-all">—</span></button>
    </div>

    <!-- OVERDUE -->
    <div class="panel active" id="panel-overdue">
      <div class="table-card">
        <div class="table-hdr"><span class="table-hdr-title">Overdue Installments</span><span class="table-count" id="cnt-overdue-lbl">—</span></div>
        <div id="overdue-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      </div>
    </div>

    <!-- ALL -->
    <div class="panel" id="panel-all">
      <div class="filters-card">
        <div class="filters-row">
          <select class="filter-select" id="filter-status">
            <option value="">All Statuses</option>
            <option value="PENDING">Pending</option>
            <option value="PAID">Paid</option>
            <option value="OVERDUE">Overdue</option>
            <option value="PARTIAL">Partial</option>
          </select>
          <input class="filter-date" type="date" id="filter-from" title="Due from"/>
          <input class="filter-date" type="date" id="filter-to"   title="Due to"/>
          <button class="btn-filter primary" onclick="loadAll()"><i class="ti ti-filter"></i> Filter</button>
          <button class="btn-filter ghost"   onclick="resetFilters()"><i class="ti ti-refresh"></i> Reset</button>
        </div>
      </div>
      <div class="table-card">
        <div class="table-hdr"><span class="table-hdr-title">All Installments</span><span class="table-count" id="cnt-all-lbl">—</span></div>
        <div id="all-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      </div>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="inst-drawer">
  <div class="drawer-header"><span class="drawer-title">Installment Detail</span><button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="scripts.js"></script>
</body>
</html>
