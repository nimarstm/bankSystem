<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EliraPay — Admin · Transactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-building-bank"></i></div><span class="sidebar-logo-text">EliraPay</span></div>
  <div class="role-badge" id="role-badge"><i class="ti ti-id-badge"></i> <span id="role-label">Staff</span></div>
  <div class="sidebar-section">Overview</div>
  <a class="nav-item" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
  <div class="sidebar-section">Operations</div>
  <a class="nav-item" href="../../staff/accounts/staff-accounts.html"><i class="ti ti-wallet"></i> Accounts</a>
  <a class="nav-item active" href="../../staff/transactions/staff-transactions.html"><i class="ti ti-arrows-right-left"></i> Transactions</a>
  <a class="nav-item manager-only" id="nav-loans" href="../../staff/loans/staff-loans.html"><i class="ti ti-coin"></i> Loan Requests <span class="nav-badge" id="pending-badge">—</span></a>
  <a class="nav-item" href="../../staff/installments/staff-installments.html"><i class="ti ti-receipt"></i> Installments</a>
  <div class="sidebar-section">Customer</div>
  <a class="nav-item" href="../../staff/users/staff-users.html"><i class="ti ti-users"></i> Customers</a>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar" style="background:linear-gradient(135deg,#10b981,#059669);">--</div>
      <div class="user-info"><div class="user-name" id="sidebar-name">Staff</div><div class="user-role-txt" id="sidebar-role">Employee</div></div>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Transaction Management</h1><p>Search, inspect and reverse transactions</p></div>
    <a class="back-btn" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="content">

    <!-- REFERENCE LOOKUP -->
    <div class="lookup-card">
      <div class="lookup-wrap">
        <i class="ti ti-hash"></i>
        <input class="lookup-input" id="ref-input" type="text" placeholder="Lookup by reference number (e.g. TXN2026051400001)…"/>
      </div>
      <button class="lookup-btn" onclick="lookupByRef()"><i class="ti ti-search"></i> Lookup</button>
      <div class="lookup-result" id="lookup-result"></div>
    </div>

    <!-- FILTERS -->
    <div class="filters-card">
      <div class="filters-row">
        <select class="filter-select" id="filter-type">
          <option value="">All Types</option>
          <option value="CARD_TO_CARD">Card to Card</option>
          <option value="IBAN_TRANSFER">IBAN Transfer</option>
          <option value="INTERNAL_TRANSFER">Internal Transfer</option>
          <option value="CASH_DEPOSIT">Cash Deposit</option>
          <option value="CASH_WITHDRAW">Cash Withdraw</option>
          <option value="LOAN_DISBURSEMENT">Loan Disbursement</option>
          <option value="INSTALLMENT_PAYMENT">Installment Payment</option>
          <option value="REFUND">Refund</option>
          <option value="LATE_FEE">Late Fee</option>
        </select>
        <select class="filter-select" id="filter-status">
          <option value="">All Statuses</option>
          <option value="SUCCESS">Success</option>
          <option value="PENDING">Pending</option>
          <option value="FAILED">Failed</option>
          <option value="BLOCKED">Blocked</option>
          <option value="REVERSED">Reversed</option>
        </select>
        <input class="filter-date" type="date" id="filter-from" title="From date"/>
        <input class="filter-date" type="date" id="filter-to"   title="To date"/>
        <button class="btn-filter primary" onclick="loadTx(1)"><i class="ti ti-filter"></i> Filter</button>
        <button class="btn-filter ghost"   onclick="resetFilters()"><i class="ti ti-refresh"></i> Reset</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-hdr"><span class="table-hdr-title">Transactions</span><span class="table-count" id="table-count">—</span></div>
      <div id="table-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      <div class="pagination" id="pagination" style="display:none;">
        <span class="pag-info" id="pag-info">—</span>
        <div class="pag-btns" id="pag-btns"></div>
      </div>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="tx-drawer">
  <div class="drawer-header"><span class="drawer-title">Transaction Detail</span><button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="scripts.js"></script>
</body>
</html>
