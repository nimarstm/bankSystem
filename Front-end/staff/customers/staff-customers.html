<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EliraPay — Staff · Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-building-bank"></i></div><span class="sidebar-logo-text">EliraPay</span></div>
  <div class="role-badge" id="role-badge"><i class="ti ti-id-badge"></i><span id="role-label">Staff</span></div>
  <div class="sidebar-section">Overview</div>
  <a class="nav-item" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
  <div class="sidebar-section">Operations</div>
  <a class="nav-item" href="../../staff/accounts/staff-accounts.html"><i class="ti ti-wallet"></i> Accounts</a>
  <a class="nav-item" href="../../staff/transactions/staff-transactions.html"><i class="ti ti-arrows-right-left"></i> Transactions</a>
  <a class="nav-item" id="nav-loans" href="../../staff/loans/staff-loans.html" style="display:none;"><i class="ti ti-coin"></i> Loan Requests</a>
  <div class="sidebar-section">Customer</div>
  <a class="nav-item active" href="../../staff/customers/staff-customers.html"><i class="ti ti-users"></i> Customers</a>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">--</div>
      <div class="user-info"><div class="user-name" id="sidebar-name">Staff</div><div class="user-role-txt" id="sidebar-role">Employee</div></div>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Customers</h1><p>View customer profiles and linked accounts</p></div>
    <a class="back-btn" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="content">
    <div class="filters-card">
      <div class="filters-row">
        <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input" id="search" type="text" placeholder="Search by name, phone, email…"/></div>
        <select class="filter-select" id="filter-status">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="blocked">Blocked</option>
          <option value="suspended">Suspended</option>
        </select>
        <select class="filter-select" id="filter-verified">
          <option value="">Verified?</option>
          <option value="true">Verified</option>
          <option value="false">Unverified</option>
        </select>
        <button class="btn-filter primary" onclick="loadCustomers(1)"><i class="ti ti-filter"></i> Filter</button>
        <button class="btn-filter ghost"   onclick="resetFilters()"><i class="ti ti-refresh"></i> Reset</button>
      </div>
    </div>
    <div class="table-card">
      <div class="table-hdr"><span class="table-hdr-title">Customers</span><span class="table-count" id="table-count">—</span></div>
      <div id="table-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      <div class="pagination" id="pagination" style="display:none;">
        <span class="pag-info" id="pag-info">—</span>
        <div class="pag-btns" id="pag-btns"></div>
      </div>
    </div>
  </div>
</div>

<!-- CUSTOMER DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="customer-drawer">
  <div class="drawer-header"><span class="drawer-title">Customer Profile</span><button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button></div>
  <div class="drawer-body" id="drawer-body"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="scripts.js"></script>
</body>
</html>
