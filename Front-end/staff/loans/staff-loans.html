<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EliraPay — Staff · Loan Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-building-bank"></i></div><span class="sidebar-logo-text">EliraPay</span></div>
  <div class="role-badge"><i class="ti ti-crown"></i> Manager</div>
  <div class="sidebar-section">Overview</div>
  <a class="nav-item" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
  <div class="sidebar-section">Operations</div>
  <a class="nav-item" href="../../staff/accounts/staff-accounts.html">a<i class="ti ti-wallet"></i> Accounts</a>
  <a class="nav-item" href="../../staff/transactions/staff-transactions.html"><i class="ti ti-arrows-right-left"></i> Transactions</a>
  <a class="nav-item active" href="../../staff/loans/staff-loans.html"><i class="ti ti-coin"></i> Loan Requests <span class="nav-badge" id="pending-badge">—</span></a>
  <div class="sidebar-section">Customer</div>
  <a class="nav-item" href="../../staff/customers/staff-customers.html"><i class="ti ti-users"></i> Customers</a>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">MG</div>
      <div class="user-info"><div class="user-name" id="sidebar-name">Manager</div><div class="user-role-txt">Manager</div></div>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Loan Requests</h1><p>Evaluate, approve or reject customer loan applications</p></div>
    <a class="back-btn" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="content">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-pending"  onclick="switchTab('pending')"><i class="ti ti-clock"></i> Pending Review <span class="tab-count" id="cnt-pending">—</span></button>
      <button class="tab-btn"        id="tab-all"      onclick="switchTab('all')"><i class="ti ti-list"></i> All Requests <span class="tab-count" id="cnt-all">—</span></button>
    </div>

    <div class="panel active" id="panel-pending">
      <div class="table-card">
        <div class="table-hdr"><span class="table-hdr-title">Awaiting Review</span><span class="table-count" id="cnt-pending-lbl">—</span></div>
        <div id="pending-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      </div>
    </div>

    <div class="panel" id="panel-all">
      <div class="table-card">
        <div class="table-hdr"><span class="table-hdr-title">All Requests</span><span class="table-count" id="cnt-all-lbl">—</span></div>
        <div id="all-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
      </div>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="loan-drawer">
  <div class="drawer-header"><span class="drawer-title">Loan Request</span><button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<!-- REJECT MODAL -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <div class="modal-header">Reject Loan Request</div>
    <div class="modal-body">
      <div class="field"><label>Reason for rejection</label><textarea id="reject-reason" placeholder="Explain why this request is rejected…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" onclick="closeRejectModal()">Cancel</button>
      <button class="btn danger" id="reject-btn" onclick="confirmReject()">
        <div class="spinner" id="reject-spin"></div>
        <span id="reject-text"><i class="ti ti-circle-x"></i> Reject</span>
      </button>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>

<script src="scripts.js"></script>
</body>
</html>
