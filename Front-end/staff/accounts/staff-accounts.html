<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EliraPay — Staff · Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ti ti-building-bank"></i></div><span class="sidebar-logo-text">EliraPay</span></div>
  <div class="role-badge" id="role-badge"><i class="ti ti-id-badge"></i><span id="role-label">Staff</span></div>
  <div class="sidebar-section">Overview</div>
  <a class="nav-item" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
  <div class="sidebar-section">Operations</div>
  <a class="nav-item active" href="../../staff/accounts/staff-accounts.html"><i class="ti ti-wallet"></i> Accounts</a>
  <a class="nav-item" href="../../staff/transactions/staff-transactions.html"><i class="ti ti-arrows-right-left"></i> Transactions</a>
  <a class="nav-item" id="nav-loans" href="../../staff/loans/staff-loans.html" style="display:none;"><i class="ti ti-coin"></i> Loan Requests</a>
  <div class="sidebar-section">Customer</div>
  <a class="nav-item" href="../../staff/customers/staff-customers.html"><i class="ti ti-users"></i> Customers</a>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">--</div>
      <div class="user-info"><div class="user-name" id="sidebar-name">Staff</div><div class="user-role-txt" id="sidebar-role">Employee</div></div>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Accounts</h1><p>View and manage customer bank accounts</p></div>
    <a class="back-btn" href="../../staff/dashboard/staff-dashboard.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="content">
    <div class="filters-card">
      <div class="filters-row">
        <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input" id="search" type="text" placeholder="Search by account number or IBAN…"/></div>
        <select class="filter-select" id="filter-status">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="BLOCKED">Blocked</option>
          <option value="CLOSED">Closed</option>
        </select>
        <select class="filter-select" id="filter-type">
          <option value="">All Types</option>
          <option value="SAVING">Saving</option>
          <option value="CURRENT">Current</option>
          <option value="BUSINESS">Business</option>
        </select>
        <button class="btn-filter primary" onclick="loadAccounts()"><i class="ti ti-filter"></i> Filter</button>
        <button class="btn-filter ghost"   onclick="resetFilters()"><i class="ti ti-refresh"></i> Reset</button>
      </div>
    </div>
    <div class="table-card">
      <div class="table-hdr"><span class="table-hdr-title">Accounts</span><span class="table-count" id="table-count">—</span></div>
      <div id="table-wrap"><div class="empty-state"><i class="ti ti-loader-2"></i><p>Loading…</p></div></div>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="acct-drawer">
  <div class="drawer-header"><span class="drawer-title">Account Detail</span><button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button></div>
  <div style="display:flex;border-bottom:1px solid var(--border);flex-shrink:0;">
    <button style="flex:1;padding:10px;border:none;background:none;font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.18s;" id="dtab-detail"    class="dtab active-dtab" onclick="switchDTab('detail')"><i class="ti ti-wallet"></i> Detail</button>
    <button style="flex:1;padding:10px;border:none;background:none;font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.18s;" id="dtab-statement" class="dtab" onclick="switchDTab('statement')"><i class="ti ti-file-description"></i> Statement</button>
    <button style="flex:1;padding:10px;border:none;background:none;font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.18s;" id="dtab-limits"    class="dtab" onclick="switchDTab('limits')"><i class="ti ti-chart-bar"></i> Limits</button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:1.5rem;" id="dpanel-detail"></div>
  <div style="display:none;flex:1;overflow-y:auto;padding:1.5rem;" id="dpanel-statement"><div style="text-align:center;padding:2rem;color:var(--text-3);font-size:13px;"><i class="ti ti-loader-2" style="font-size:28px;display:block;margin-bottom:8px;"></i>Loading…</div></div>
  <div style="display:none;flex:1;overflow-y:auto;padding:1.5rem;" id="dpanel-limits"><div style="text-align:center;padding:2rem;color:var(--text-3);font-size:13px;"><i class="ti ti-loader-2" style="font-size:28px;display:block;margin-bottom:8px;"></i>Loading…</div></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<!-- AMOUNT MODAL -->
<div class="modal-overlay" id="amount-modal">
  <div class="modal">
    <div class="modal-header" id="amount-modal-title">Deposit</div>
    <div class="modal-body">
      <div class="field"><label>Amount (€)</label><input type="number" id="modal-amount" placeholder="0.00" min="0.01" step="0.01"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" onclick="closeAmountModal()">Cancel</button>
      <button class="btn primary" id="amount-btn" onclick="confirmAmount()">
        <div class="spinner" id="amount-spin"></div>
        <span id="amount-btn-text">Confirm</span>
      </button>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>

<script src="scripts.js"> </script>
</body>
</html>
